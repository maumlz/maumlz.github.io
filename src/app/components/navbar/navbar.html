<div [ngClass]="{ 'main-menu': this.route === '' }">
  <nav
    aria-label="Main navigation"
    [ngClass]="{ 'flex-column': this.route === '' }"
    class="navbar navbar-expand d-flex justify-content-between px-3"
  >
    @if (route === '') {
      <h1 class="menu-title">Mauricio Meléndez</h1>
    }
    <ul
      [ngClass]="{ 'navbar-nav': this.route !== '', 'flex-column': this.route === '' }"
      class="nav"
    >
      <li class="nav-item">
        <a
          class="nav-link p-3"
          routerLinkActive="active"
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          >Home</a
        >
      </li>
      <li class="nav-item">
        <a class="nav-link p-3" routerLinkActive="active" routerLink="/about">About</a>
      </li>
      <li class="nav-item">
        <a class="nav-link p-3" routerLinkActive="active" routerLink="/resume">Resume</a>
      </li>
    </ul>

    <ul class="navbar-nav p-3">
      <li class="nav-item">
        <button class="btn btn-primary halo-button" (click)="toggleLanguage()">
          {{ currentLanguage === 'en' ? 'Español' : 'English' }}
        </button>
      </li>
    </ul>
  </nav>
</div>
